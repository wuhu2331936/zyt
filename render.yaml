# Render Blueprint —— 推到 GitHub 后在 Render 里 "New > Blueprint" 选这个仓库即可一键部署。
# 后端单端口 8000 同时托管前端 dist，所以只需要一个 Web Service，一个公网网址搞定。
services:
  - type: web
    name: zhiyaotong
    runtime: python
    plan: free
    region: singapore          # 新加坡节点，国内访问相对最快
    branch: main
    healthCheckPath: /api/health
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements-cloud.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SERVE_FRONTEND
        value: "1"
      # 下面两个 Key 在 Render 面板里手填，不要写进仓库（sync: false = 不随仓库同步）
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
