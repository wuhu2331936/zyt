name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('backend/requirements-rag.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install core dependencies
        run: |
          cd backend
          pip install -r requirements-core.txt
          pip install -r requirements-ai.txt
          pip install pytest pytest-asyncio httpx

      - name: Smoke test: app imports
        run: |
          cd backend
          python -c "from app.main import app; print(app.version)"
          python -c "import app.services.qwen_vl, app.services.deepseek, app.services.tts"
        env:
          # 用假 Key 让 Pydantic 通过校验
          DASHSCOPE_API_KEY: "sk-fake-test-only-do-not-use"
          DEEPSEEK_API_KEY: "sk-fake-test-only-do-not-use"

      - name: Run pytest
        run: |
          cd backend
          pytest tests/ -v --tb=short
        env:
          DASHSCOPE_API_KEY: "sk-fake-test-only-do-not-use"
          DEEPSEEK_API_KEY: "sk-fake-test-only-do-not-use"
