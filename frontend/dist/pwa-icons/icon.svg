<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1989fa"/>
      <stop offset="100%" stop-color="#0570e0"/>
    </linearGradient>
    <linearGradient id="pillLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
    <linearGradient id="pillRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd21d"/>
      <stop offset="100%" stop-color="#ffb800"/>
    </linearGradient>
    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.18"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>

  <!-- 装饰圆 -->
  <circle cx="80" cy="80" r="40" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="430" cy="430" r="60" fill="#ffffff" fill-opacity="0.05"/>

  <!-- 药丸主体（水平 + 微微倾斜 -8°） -->
  <g transform="rotate(-15 256 256)" filter="url(#shadow)">
    <!-- 白色半边 -->
    <rect x="80" y="216" width="180" height="80" rx="40" ry="40" fill="url(#pillLeft)"/>
    <!-- 黄色半边 -->
    <rect x="252" y="216" width="180" height="80" rx="40" ry="40" fill="url(#pillRight)"/>
    <!-- 中线分隔（更真实） -->
    <rect x="256" y="216" width="2" height="80" fill="#cccccc" fill-opacity="0.6"/>
    <!-- 高光（让药丸更有质感） -->
    <ellipse cx="170" cy="232" rx="50" ry="6" fill="#ffffff" fill-opacity="0.5"/>
  </g>

  <!-- 底部文字 -->
  <text x="256" y="430"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"
    font-size="56"
    font-weight="700"
    fill="#ffffff">智药通</text>
</svg>
